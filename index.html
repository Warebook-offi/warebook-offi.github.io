<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warebook · Música</title>
<meta name="description" content="Web oficial de Warebook. Música, vídeos y enlaces a todas mis plataformas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d18;
    --panel: #151729;
    --ink: #f3f4ff;
    --muted: #a3a7c9;
    --line: #2a2d4d;
    --orange: #ff8a1f;
    --red: #e8262a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
  .wrap { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  .hero img { display: block; width: 100%; height: auto; }
  .intro { padding: 2rem 0 2.5rem; text-align: center; }
  .tagline { max-width: 32rem; margin: 0 auto 1.5rem; color: var(--muted); font-size: 1.2rem; }
  .btn {
    display: inline-block;
    background: linear-gradient(90deg, var(--orange), var(--red));
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    padding: .9rem 1.8rem;
    border-radius: 999px;
  }
  .btn:hover { filter: brightness(1.12); }

  section { padding: 2.5rem 0; border-top: 1px solid var(--line); }
  h2 { font-family: "Syne", "Arial Black", sans-serif; font-size: 1.9rem; letter-spacing: -.02em; margin: 0 0 1.5rem; }

  .platforms { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 1rem; list-style: none; margin: 0; padding: 0; }
  .platforms a { display: block; border-radius: 1rem; overflow: hidden; border: 1px solid var(--line); transition: transform .2s; }
  .platforms a:hover { transform: translateY(-4px); border-color: var(--orange); }
  .platforms img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }

  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks li { padding: .9rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }
  .tracks .year { color: var(--muted); }

  footer { padding: 2.5rem 0 4rem; color: var(--muted); border-top: 1px solid var(--line); text-align: center; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .platforms a { transition: none; } }
</style>
</head>
<body>

<header class="hero">
  <h1 class="sr">Warebook</h1>
  <img src="img/cabecera.jpg" alt="Logotipo de Warebook con ondas de sonido" width="1600" height="900">
</header>

<div class="intro wrap">
  <!-- CAMBIA este texto por una frase tuya sobre tu música -->
  <p class="tagline">Música nueva, vídeos y todo lo que voy publicando, en un solo sitio.</p>
  <a class="btn" href="#escuchar">Escuchar ahora</a>
</div>

<main class="wrap">

  <section id="escuchar">
    <h2>Escúchame y sígueme</h2>
    <ul class="platforms">
      <!-- CAMBIA cada href="#" por tu enlace real -->
      <li><a href="#" aria-label="Warebook en YouTube"><img src="img/youtube.jpg" alt="Warebook YouTube" width="640" height="640" loading="lazy"></a></li>
      <li><a href="#" aria-label="Warebook en TikTok"><img src="img/tiktok.jpg" alt="Warebook TikTok" width="640" height="640" loading="lazy"></a></li>
      <li><a href="#" aria-label="Warebook en Suno"><img src="img/suno.jpg" alt="Warebook Suno" width="640" height="640" loading="lazy"></a></li>
      <li><a href="#" aria-label="Warebook en RouteNote"><img src="img/routenote.jpg" alt="Warebook RouteNote" width="640" height="640" loading="lazy"></a></li>
    </ul>
  </section>

  <section id="musica">
    <h2>Música</h2>
    <ul class="tracks">
      <!-- CAMBIA o copia estas líneas para añadir tus canciones -->
      <li><span>Título de tu canción</span><span class="year">2026</span></li>
      <li><span>Otro título</span><span class="year">2026</span></li>
    </ul>
  </section>

  <section id="contacto">
    <h2>Contacto</h2>
    <!-- CAMBIA el correo por el tuyo -->
    <p>Para colaboraciones o prensa: <a href="mailto:tucorreo@ejemplo.com">tucorreo@ejemplo.com</a></p>
  </section>

</main>

<footer>© 2026 Warebook</footer>

</body>
</html>
